name: ci

on:
  pull_request:
    branches: [main]
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm
        run: npm install -g npm@11.7.0

      - name: Print versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Run tests
        run: npm run test
